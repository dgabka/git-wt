name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: bash -n wt test.sh completions/wt.bash
      - run: zsh -n completions/_wt
      - run: shellcheck -e SC1090 wt test.sh completions/wt.bash
      - run: ./test.sh
